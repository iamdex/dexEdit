name: dexEdit

options:
  bundleIdPrefix: com.espertini
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    # Ad-hoc signing so `xcodebuild` works with no developer team configured.
    # Sandbox entitlements are honoured for locally-run builds.
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGNING_REQUIRED: YES
    CODE_SIGNING_ALLOWED: YES
    ENABLE_HARDENED_RUNTIME: YES
    SWIFT_STRICT_CONCURRENCY: minimal

targets:
  dexEdit:
    type: application
    platform: macOS
    sources:
      - path: Sources
      # Only the catalog, so the entitlements file beside it stays out of the bundle.
      - path: Resources/Assets.xcassets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.espertini.dexEdit
        PRODUCT_NAME: dexEdit
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_ENTITLEMENTS: Resources/dexEdit.entitlements
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.productivity
        INFOPLIST_KEY_NSHumanReadableCopyright: ""
        # Single-window app; no document types, no state restoration surprises.
        INFOPLIST_KEY_NSSupportsAutomaticTermination: NO
        INFOPLIST_KEY_NSSupportsSuddenTermination: NO
        COMBINE_HIDPI_IMAGES: YES

  dexEditTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      # The logic under test is pure, so it is compiled straight into the test
      # bundle. No app is launched to exercise string functions.
      - path: Sources/Notes/Note.swift
      - path: Sources/Notes/NotesLibrary.swift
      - path: Sources/LaunchTimer.swift
      - path: Sources/Editor/MarkdownScanner.swift
      - path: Sources/Editor/MarkdownFormatter.swift
      - path: Sources/Editor/ActiveFormats.swift
      - path: Tests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.espertini.dexEditTests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  dexEdit:
    build:
      targets:
        dexEdit: all
        dexEditTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - dexEditTests
    archive:
      config: Release

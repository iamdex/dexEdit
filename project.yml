name: dexEdit

options:
  bundleIdPrefix: com.espertini
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    # Real signing, for both platforms: an iPhone won't run an ad-hoc
    # signature, and the Mac app may as well carry the same one. Xcode makes
    # and renews the profiles itself from this team.
    CODE_SIGN_STYLE: Automatic
    CODE_SIGN_IDENTITY: "Apple Development"
    DEVELOPMENT_TEAM: H68SYWLGDR
    CODE_SIGNING_REQUIRED: YES
    CODE_SIGNING_ALLOWED: YES
    ENABLE_HARDENED_RUNTIME: YES
    SWIFT_STRICT_CONCURRENCY: minimal

packages:
  MarkdownCore:
    path: MarkdownCore

targets:
  dexEdit:
    type: application
    platform: macOS
    dependencies:
      - package: MarkdownCore
    sources:
      - path: Sources
      # The file layer is the same app on both platforms.
      - path: Shared
      # Only the catalog and the manifest, so the entitlements file beside them
      # stays out of the bundle.
      - path: Resources/Assets.xcassets
      - path: Resources/PrivacyInfo.xcprivacy
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.espertini.dexEdit
        PRODUCT_NAME: dexEdit
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_ENTITLEMENTS: Resources/dexEdit.entitlements
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.productivity
        INFOPLIST_KEY_NSHumanReadableCopyright: ""
        # Single-window app; no document types, no state restoration surprises.
        INFOPLIST_KEY_NSSupportsAutomaticTermination: NO
        INFOPLIST_KEY_NSSupportsSuddenTermination: NO
        COMBINE_HIDPI_IMAGES: YES

  dexEditiOS:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    dependencies:
      - package: MarkdownCore
    sources:
      - path: iOS
      # The file layer is the same app on both platforms.
      - path: Shared
      # Same declaration for both: the app does the same things on each.
      - path: Resources/PrivacyInfo.xcprivacy
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.espertini.dexEdit
        PRODUCT_NAME: dexEdit
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: YES
        TARGETED_DEVICE_FAMILY: "1,2"
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        # The app's own Documents folder shows up in Files, so notes are
        # reachable from outside and can be moved into iCloud Drive.
        INFOPLIST_KEY_UIFileSharingEnabled: YES
        INFOPLIST_KEY_LSSupportsOpeningDocumentsInPlace: YES

  dexEditTests:
    type: bundle.unit-test
    platform: macOS
    dependencies:
      - package: MarkdownCore
    sources:
      # Only the app-side file work lives here now; everything pure moved to
      # the MarkdownCore package, which carries its own tests.
      - path: Shared/NotesLibrary.swift
      - path: Shared/CoordinatedFile.swift
      - path: Shared/LaunchTimer.swift
      - path: Tests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.espertini.dexEditTests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  dexEdit:
    build:
      targets:
        dexEdit: all
        dexEditTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - dexEditTests
    archive:
      config: Release

  dexEditiOS:
    build:
      targets:
        dexEditiOS: all
    run:
      config: Debug
    archive:
      config: Release
